.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px}

.card-prompt.expanded{max-height:none}

.btn-sm{padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-copy{background:var(--accent);color:#000}

footer{text-align:center;padding:32px;color:var(--text-dim);font-size:13px;border-top:1px solid var(--border);margin-top:40px}

iew cadence, coaching questions, forecast accuracy method, and stale deal identification rules."}, {"title": "Cross-Selling Strategy", "prompt": "Create a cross-selling strategy for [PRODUCT LINE]. Include: product affinity analysis, customer segmentation by purchase history, cross-sell triggers, timing strategy, script/email templates, incentive structure, and success metrics."}, {"title": "Sales Onboarding Plan", "prompt": "Create a 30-60-90 day sales onboarding plan for new reps at [COMPANY]. Include: product training schedule, shadowing plan, call/video review process, first deals timeline, quota ramp, mentorship structure, and success milestones."}]}}};
let allPrompts=[];
let activeCategory='all';

function flattenPrompts(){
const result=[];
Object.keys(PROMPTS.categories).forEach(key=>{
const cat=PROMPTS.categories[key];
cat.prompts.forEach(p=>{
result.push({...p,categoryKey:key,categoryName:cat.name,icon:cat.icon});
});
});
return result;
}

function init(){
allPrompts=flattenPrompts();
//categories
const catContainer=document.getElementById('categories');
catContainer.innerHTML='<div class="cat-btn active" data-cat="all" onclick="setCategory(\'all\')">🌐 All ('+allPrompts.length+')</div>';
Object.keys(PROMPTS.categories).forEach(key=>{
const cat=PROMPTS.categories[key];
catContainer.innerHTML+='<div class="cat-btn" data-cat="'+key+'" onclick="setCategory(\''+key+'\')">'+cat.icon+' '+cat.name+' ('+cat.prompts.length+')</div>';
});
renderPrompts();
}

function setCategory(cat){
activeCategory=cat;
document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
document.querySelector('[data-cat="'+cat+'"]').classList.add('active');
renderPrompts();
}

function filterPrompts(){
renderPrompts();
}

function renderPrompts(){
const search=document.getElementById('search').value.toLowerCase();
let filtered=allPrompts;
if(activeCategory!=='all')filtered=filtered.filter(p=>p.categoryKey===activeCategory);
if(search)filtered=filtered.filter(p=>p.title.toLowerCase().includes(search)||p.prompt.toLowerCase().includes(search)||p.categoryName.toLowerCase().includes(search));
document.getElementById('stats').textContent=filtered.length+' prompts';
const grid=document.getElementById('grid');
document.getElementById('empty').style.display=filtered.length===0?'block':'none';
if(filtered.length===0){grid.innerHTML='';return;}
grid.innerHTML=filtered.map((p,i)=>`
<div class="card">
<div class="card-cat">${p.icon} ${p.categoryName}</div>
<div class="card-title">${p.title}</div>
<div class="card-prompt" id="prompt-${i}">${escapeHtml(p.prompt)}</div>
<div class="card-actions">
<button class="btn-sm btn-copy" onclick="copyPrompt(${i})">📋 Copy</button>
<button class="btn-sm btn-expand" onclick="toggleExpand(${i})">📖 Expand</button>
</div>
</div>
`).join('');
//store prompts for copy
window._filtered=filtered;
}

function toggleExpand(i){
const el=document.getElementById('prompt-'+i);
el.classList.toggle('expanded');
}

function copyPrompt(i){
const text=window._filtered[i].prompt;
navigator.clipboard.writeText(text).then(()=>{
const toast=document.getElementById('toast');
toast.classList.add('show');
setTimeout(()=>toast.classList.remove('show'),2000);
});
}

function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

init();
</script>
